name: Decode PDF B release

on:
  push:
    branches: [ pdf-b-release ]

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify ZIP
        shell: pwsh
        run: |
          $path = 'PDF-B/PDF_B_v1.0.0_win-x64.zip'
          $b64 = (Get-Content -Raw $path).Trim()
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes($path, $bytes)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
          Write-Host "Verified ZIP entries: $($zip.Entries.Count)"
          $zip.Dispose()
      - name: Commit verified binary ZIP
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PDF-B/PDF_B_v1.0.0_win-x64.zip
          git commit -m "Publish verified PDF B binary ZIP"
          git push origin HEAD:pdf-b-release
