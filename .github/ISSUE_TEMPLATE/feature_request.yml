name: Feature request
description: Suggest an improvement to Kataterra
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow or problem
      description: What are you trying to complete, and where does the current workflow slow you down?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Describe the result you would find useful.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional sanitized examples or screenshots.
