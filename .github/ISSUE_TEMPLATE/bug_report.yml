name: Bug report
description: Report a reproducible problem in Kataterra
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer data, private exports or sensitive coordinates.
  - type: input
    id: version
    attributes:
      label: Kataterra version
      placeholder: 3.0.0-simple.22
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostics
      description: Add an error message or a sanitized screenshot when useful.
