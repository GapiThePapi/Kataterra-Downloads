<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF B v1.0.0</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f5f7;color:#111;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;padding:32px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08);max-width:520px;width:calc(100% - 48px);text-align:center}h1{margin:0 0 8px;font-size:32px}p{color:#666;line-height:1.5}button{background:#111;color:#fff;border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:12px}button:disabled{opacity:.5;cursor:wait}.small{font-size:13px;color:#888;margin-top:14px}</style></head><body><div class="card"><h1>PDF B</h1><p>Windows Excel worksheet to PDF exporter.</p><button id="dl">Download PDF B v1.0.0</button><div class="small" id="status">Portable Windows x64 package</div></div><script>const btn=document.getElementById('dl'),status=document.getElementById('status');btn.onclick=async()=>{btn.disabled=true;status.textContent='Preparing download…';try{const u='https://raw.githubusercontent.com/GapiThePapi/Kataterra-Downloads/main/PDF-B/PDF_B_v1.0.0_win-x64.zip';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Download source unavailable');const t=(await r.text()).replace(/\s+/g,'');const bin=atob(t);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const blob=new Blob([bytes],{type:'application/zip'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PDF_B_v1.0.0_win-x64.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='Download started.';}catch(e){status.textContent='Could not prepare the download. Please try again.';}finally{btn.disabled=false;}};</script></body></html>
